# DB Version: 18
# OS Type: linux
# DB Type: web
# Total Memory (RAM): 62 GB
# CPUs num: 24
# Data Storage: ssd
#
# Sized for about half the box: the t3 devel stack runs here too.

# Loaded by Patroni as custom_conf: node-local tuning only. Patroni writes
# PGDATA/postgresql.conf, which includes this file and then appends what it
# manages itself, so these are deliberately absent here:
#   - listen_addresses, hba_file: patroni/00-cluster.yml in the image
#   - max_connections, max_worker_processes, shared_preload_libraries and the
#     replication settings: cluster-wide, in the DCS (change them with
#     `make edit-config` on idertator-server-03, not here)
shared_buffers = 8GB
effective_cache_size = 32GB
maintenance_work_mem = 2GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 64MB
huge_pages = try
jit = off
wal_compression = lz4
autovacuum_work_mem = 1GB
# The primary uses io_uring, which needs a custom seccomp profile; worker
# runs under Docker's default one.
io_method = worker
min_wal_size = 1GB
max_wal_size = 4GB
max_parallel_workers_per_gather = 4
max_parallel_workers = 12
max_parallel_maintenance_workers = 4
